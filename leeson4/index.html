<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 7: DOM и интерактив</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Стили для светлой темы (по умолчанию) */
        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* Класс для темной темы */
        body.dark-theme {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input, button {
            padding: 8px 12px;
            font-size: 16px;
            margin-right: 5px;
        }

        ul {
            margin-top: 15px;
        }
    </style>
</head>
<body id="mainContent">

    <!-- 7.1 Список дел -->
    <div class="section">
        <h3>Список дел</h3>
        <input type="text" id="taskInput" placeholder="Введите новую задачу...">
        <button id="addBtn">Добавить</button>
        <ul id="taskList"></ul>
    </div>

    <!-- 7.2 Переключатель темы -->
    <div class="section">
        <h3>Переключатель темы</h3>
        <button id="themeBtn">Темная тема</button>
    </div>

    <script>
        // ==========================================
        // 7.1 Список дел (To-Do List)
        // ==========================================
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        addBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            
            // Проверяем, чтобы поле не было пустым
            if (taskText !== "") {
                // Создаем новый элемент списка (li)
                const newItem = document.createElement('li');
                newItem.textContent = taskText;
                
                // Добавляем созданный элемент внутрь ul
                taskList.appendChild(newItem);
                
                // Очищаем поле ввода
                taskInput.value = "";
            }
        });


        // ==========================================
        // 7.2 Переключатель темы
        // ==========================================
        const themeBtn = document.getElementById('themeBtn');
        const mainContent = document.getElementById('mainContent');

        themeBtn.addEventListener('click', () => {
            // Переключаем класс dark-theme у тега body
            mainContent.classList.toggle('dark-theme');
            
            // Меняем текст на кнопке в зависимости от наличия класса
            if (mainContent.classList.contains('dark-theme')) {
                themeBtn.textContent = "Светлая тема";
            } else {
                themeBtn.textContent = "Темная тема";
            }
        });
    </script>
</body>
</html>
